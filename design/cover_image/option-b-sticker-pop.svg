<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1600 2400" width="1600" height="2400" role="img" aria-labelledby="t d">
  <title id="t">Cover Option B — Sticker Bomb Saturday Morning</title>
  <desc id="d">Loud cereal-box pop cover: electric-blue halftone, a lemon diagonal band, a thick-outlined cartoon otter in a crooked chef hat waving a golden whisk, a winged runaway cake, and a riot of peel-off stickers.</desc>

  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;700&display=swap');
      .bangers { font-family: 'Bangers', Impact, 'Arial Black', sans-serif; letter-spacing: 4px; }
      .fredoka { font-family: 'Fredoka', 'Nunito', 'Helvetica Neue', sans-serif; }
    ]]></style>

    <pattern id="halftone" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="6" fill="#FFFFFF" opacity="0.16"/>
    </pattern>
    <pattern id="halftoneDark" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="3.5" fill="#111111" opacity="0.14"/>
    </pattern>

    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <clipPath id="heroWindow"><rect x="430" y="760" width="740" height="800" rx="60"/></clipPath>

    <symbol id="sparkle" viewBox="-20 -20 40 40">
      <path d="M0 -18 C 2 -6, 6 -2, 18 0 C 6 2, 2 6, 0 18 C -2 6, -6 2, -18 0 C -6 -2, -2 -6, 0 -18Z" fill="#FDE047" stroke="#111111" stroke-width="2.5"/>
    </symbol>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect width="1600" height="2400" fill="#2563EB"/>
  <rect width="1600" height="2400" fill="url(#halftone)"/>
  <!-- burst rays behind hero -->
  <g fill="#60A5FA" opacity="0.35">
    <path d="M800 1150 L700 -200 L900 -200Z"/>
    <path d="M800 1150 L700 -200 L900 -200Z" transform="rotate(45 800 1150)"/>
    <path d="M800 1150 L700 -200 L900 -200Z" transform="rotate(90 800 1150)"/>
    <path d="M800 1150 L700 -200 L900 -200Z" transform="rotate(135 800 1150)"/>
    <path d="M800 1150 L700 -200 L900 -200Z" transform="rotate(180 800 1150)"/>
    <path d="M800 1150 L700 -200 L900 -200Z" transform="rotate(225 800 1150)"/>
    <path d="M800 1150 L700 -200 L900 -200Z" transform="rotate(270 800 1150)"/>
    <path d="M800 1150 L700 -200 L900 -200Z" transform="rotate(315 800 1150)"/>
  </g>

  <!-- lemon diagonal band -->
  <polygon points="0,1760 1600,1360 1600,1660 0,2060" fill="#FDE047" stroke="#111111" stroke-width="14"/>
  <polygon points="0,1760 1600,1360 1600,1660 0,2060" fill="url(#halftoneDark)"/>

  <!-- ============ TITLE ============ -->
  <g transform="rotate(-5 800 480)">
    <!-- hard drop shadow copies -->
    <text x="816" y="446" class="bangers" font-size="240" fill="#111111" text-anchor="middle">BARNABY</text>
    <text x="816" y="666" class="bangers" font-size="240" fill="#111111" text-anchor="middle">WHISKERS</text>
    <!-- face -->
    <text id="slot-title-1" x="800" y="430" class="bangers" font-size="240" fill="#FFFFFF" stroke="#111111" stroke-width="14" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">BARNABY</text>
    <text id="slot-title-2" x="800" y="650" class="bangers" font-size="240" fill="#FDE047" stroke="#111111" stroke-width="14" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">WHISKERS</text>
  </g>

  <!-- ============ "NEW!" STARBURST (top-right) ============ -->
  <g transform="translate(1350 290) rotate(12)" filter="url(#stickerShadow)">
    <polygon fill="#EC4899" stroke="#111111" stroke-width="10" stroke-linejoin="round"
      points="0,-150 36,-92 104,-104 88,-40 150,0 88,40 104,104 36,92 0,150 -36,92 -104,104 -88,40 -150,0 -88,-40 -104,-104 -36,-92"/>
    <text y="22" class="bangers" font-size="84" fill="#FFFFFF" stroke="#111111" stroke-width="6" paint-order="stroke" text-anchor="middle">NEW!</text>
  </g>

  <!-- ============ REAL HERO IMAGE SLOT ============ -->
  <image id="slot-hero" x="430" y="760" width="740" height="800" preserveAspectRatio="xMidYMid slice"
         clip-path="url(#heroWindow)" display="none" href=""/>

  <!-- ============ CARTOON OTTER PLACEHOLDER ============ -->
  <g id="slot-hero-placeholder">
    <!-- rainbow hiccup bubbles -->
    <g fill="#FFFFFF" fill-opacity="0.25" stroke-width="7">
      <circle cx="1070" cy="960" r="34" stroke="#A855F7"/>
      <circle cx="1130" cy="885" r="24" stroke="#22D3EE"/>
      <circle cx="1175" cy="825" r="16" stroke="#F472B6"/>
      <circle cx="1205" cy="775" r="10" stroke="#4ADE80"/>
    </g>

    <!-- body -->
    <ellipse cx="800" cy="1390" rx="235" ry="205" fill="#B5733A" stroke="#111111" stroke-width="12"/>
    <!-- apron -->
    <path d="M650 1290 L950 1290 L992 1570 L608 1570 Z" fill="#EF4444" stroke="#111111" stroke-width="12" stroke-linejoin="round"/>
    <g fill="#FFFFFF">
      <circle cx="700" cy="1350" r="15"/><circle cx="800" cy="1335" r="15"/><circle cx="900" cy="1350" r="15"/>
      <circle cx="680" cy="1450" r="15"/><circle cx="780" cy="1440" r="15"/><circle cx="880" cy="1455" r="15"/>
      <circle cx="720" cy="1535" r="15"/><circle cx="820" cy="1525" r="15"/><circle cx="920" cy="1540" r="15"/>
    </g>
    <path d="M660 1395 L945 1395" stroke="#111111" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

    <!-- left arm + golden whisk -->
    <line x1="620" y1="1360" x2="470" y2="1225" stroke="#111111" stroke-width="86" stroke-linecap="round"/>
    <line x1="620" y1="1360" x2="470" y2="1225" stroke="#B5733A" stroke-width="62" stroke-linecap="round"/>
    <g stroke-linecap="round">
      <line x1="470" y1="1225" x2="372" y2="1030" stroke="#111111" stroke-width="30"/>
      <line x1="470" y1="1225" x2="372" y2="1030" stroke="#F59E0B" stroke-width="16"/>
      <g fill="none" stroke="#111111" stroke-width="18">
        <ellipse cx="345" cy="950" rx="46" ry="98" transform="rotate(-25 345 950)"/>
        <ellipse cx="345" cy="950" rx="46" ry="98" transform="rotate(-5 345 950)"/>
        <ellipse cx="345" cy="950" rx="46" ry="98" transform="rotate(-45 345 950)"/>
      </g>
      <g fill="none" stroke="#F59E0B" stroke-width="8">
        <ellipse cx="345" cy="950" rx="46" ry="98" transform="rotate(-25 345 950)"/>
        <ellipse cx="345" cy="950" rx="46" ry="98" transform="rotate(-5 345 950)"/>
        <ellipse cx="345" cy="950" rx="46" ry="98" transform="rotate(-45 345 950)"/>
      </g>
    </g>
    <circle cx="470" cy="1222" r="44" fill="#B5733A" stroke="#111111" stroke-width="12"/>
    <use href="#sparkle" x="245" y="810" width="70" height="70"/>
    <use href="#sparkle" x="400" y="800" width="48" height="48"/>
    <use href="#sparkle" x="230" y="980" width="40" height="40"/>

    <!-- right arm, waving -->
    <line x1="980" y1="1360" x2="1125" y2="1210" stroke="#111111" stroke-width="86" stroke-linecap="round"/>
    <line x1="980" y1="1360" x2="1125" y2="1210" stroke="#B5733A" stroke-width="62" stroke-linecap="round"/>
    <circle cx="1128" cy="1205" r="44" fill="#B5733A" stroke="#111111" stroke-width="12"/>

    <!-- head -->
    <circle cx="620" cy="962" r="50" fill="#B5733A" stroke="#111111" stroke-width="12"/>
    <circle cx="980" cy="962" r="50" fill="#B5733A" stroke="#111111" stroke-width="12"/>
    <ellipse cx="800" cy="1100" rx="212" ry="192" fill="#B5733A" stroke="#111111" stroke-width="12"/>
    <circle cx="620" cy="962" r="24" fill="#D9A066"/>
    <circle cx="980" cy="962" r="24" fill="#D9A066"/>
    <ellipse cx="800" cy="1172" rx="138" ry="96" fill="#E8C39E" stroke="#111111" stroke-width="10"/>
    <!-- blush -->
    <circle cx="680" cy="1150" r="28" fill="#F472B6" opacity="0.55"/>
    <circle cx="920" cy="1150" r="28" fill="#F472B6" opacity="0.55"/>
    <!-- eyes -->
    <circle cx="735" cy="1070" r="44" fill="#FFFFFF" stroke="#111111" stroke-width="8"/>
    <circle cx="865" cy="1070" r="44" fill="#FFFFFF" stroke="#111111" stroke-width="8"/>
    <circle cx="746" cy="1078" r="20" fill="#111111"/><circle cx="738" cy="1068" r="7" fill="#FFFFFF"/>
    <circle cx="876" cy="1078" r="20" fill="#111111"/><circle cx="868" cy="1068" r="7" fill="#FFFFFF"/>
    <!-- nose + mouth -->
    <ellipse cx="800" cy="1140" rx="34" ry="23" fill="#111111"/>
    <path d="M758 1186 Q800 1232 842 1186" fill="none" stroke="#111111" stroke-width="9" stroke-linecap="round"/>
    <path d="M782 1206 Q800 1228 818 1206 Z" fill="#F472B6"/>
    <!-- whiskers -->
    <g stroke="#111111" stroke-width="7" stroke-linecap="round">
      <line x1="662" y1="1160" x2="540" y2="1138"/><line x1="662" y1="1182" x2="540" y2="1204"/>
      <line x1="938" y1="1160" x2="1060" y2="1138"/><line x1="938" y1="1182" x2="1060" y2="1204"/>
    </g>
    <!-- crooked chef hat -->
    <g transform="rotate(-10 800 930)">
      <circle cx="700" cy="872" r="72" fill="#FFFFFF" stroke="#111111" stroke-width="10"/>
      <circle cx="900" cy="872" r="72" fill="#FFFFFF" stroke="#111111" stroke-width="10"/>
      <circle cx="800" cy="832" r="96" fill="#FFFFFF" stroke="#111111" stroke-width="10"/>
      <rect x="670" y="918" width="260" height="64" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="10"/>
    </g>
  </g>

  <!-- ============ WHOOSH! BUBBLE ============ -->
  <g transform="translate(330 1480) rotate(-8)" filter="url(#stickerShadow)">
    <path d="M-170 -70 Q-180 -130 -110 -135 L120 -135 Q190 -130 180 -70 L180 40 Q185 100 120 100 L10 100 L-40 160 L-30 100 L-110 100 Q-180 100 -170 40Z"
          fill="#FFFFFF" stroke="#111111" stroke-width="10" stroke-linejoin="round"/>
    <text y="18" class="bangers" font-size="88" fill="#111111" text-anchor="middle">WHOOSH!</text>
  </g>

  <!-- ============ WINGED RUNAWAY CAKE ============ -->
  <g transform="translate(1290 1000) rotate(14)" filter="url(#stickerShadow)">
    <!-- wings -->
    <ellipse cx="-150" cy="-10" rx="70" ry="34" fill="#FFFFFF" stroke="#111111" stroke-width="8" transform="rotate(-20 -150 -10)"/>
    <ellipse cx="150" cy="-10" rx="70" ry="34" fill="#FFFFFF" stroke="#111111" stroke-width="8" transform="rotate(20 150 -10)"/>
    <!-- tiers -->
    <rect x="-110" y="20" width="220" height="70" rx="12" fill="#F9A8D4" stroke="#111111" stroke-width="8"/>
    <rect x="-80" y="-40" width="160" height="60" rx="12" fill="#FDE68A" stroke="#111111" stroke-width="8"/>
    <rect x="-50" y="-90" width="100" height="50" rx="12" fill="#F9A8D4" stroke="#111111" stroke-width="8"/>
    <!-- icing drips -->
    <path d="M-110 30 Q-90 60 -70 30 Q-50 60 -30 30 Q-10 60 10 30 Q30 60 50 30 Q70 60 90 30 Q100 50 110 30" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <!-- cherry + crown (it IS royal) -->
    <circle cx="0" cy="-110" r="18" fill="#EF4444" stroke="#111111" stroke-width="6"/>
    <path d="M-40 -150 L-25 -120 L0 -145 L25 -120 L40 -150 L40 -112 L-40 -112Z" fill="#FDE047" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>
    <!-- motion lines -->
    <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.8">
      <line x1="-260" y1="60" x2="-200" y2="60"/><line x1="-290" y1="100" x2="-210" y2="100"/><line x1="-250" y1="140" x2="-205" y2="140"/>
    </g>
  </g>

  <!-- ============ SUBTITLE ON THE BAND ============ -->
  <text id="slot-subtitle" x="800" y="1745" class="bangers" font-size="112" fill="#111111" text-anchor="middle" transform="rotate(-14 800 1710)">&amp; THE RUNAWAY ROYAL CAKE</text>

  <!-- ============ AUTHOR PILL ============ -->
  <g transform="translate(800 2170) rotate(3)" filter="url(#stickerShadow)">
    <rect x="-330" y="-62" width="660" height="124" rx="62" fill="#FFFFFF" stroke="#111111" stroke-width="10"/>
    <text id="slot-author" y="24" class="fredoka" font-size="68" font-weight="700" fill="#111111" text-anchor="middle">by Leo, age 7</text>
  </g>

  <!-- ============ STICKER: 100% KID-DIRECTED ============ -->
  <g transform="translate(1330 2160) rotate(12)" filter="url(#stickerShadow)">
    <circle r="135" fill="#4ADE80" stroke="#111111" stroke-width="10"/>
    <circle r="112" fill="none" stroke="#111111" stroke-width="4" stroke-dasharray="10 10"/>
    <text y="-18" class="fredoka" font-size="44" font-weight="700" fill="#111111" text-anchor="middle">100%</text>
    <text y="34" class="fredoka" font-size="36" font-weight="700" fill="#111111" text-anchor="middle">KID-DIRECTED</text>
  </g>

  <!-- ============ STICKER: WARNING ============ -->
  <g transform="translate(300 2200) rotate(-8)" filter="url(#stickerShadow)">
    <rect x="-220" y="-90" width="440" height="180" rx="18" fill="#F97316" stroke="#111111" stroke-width="10"/>
    <text id="slot-blurb-1" y="-22" class="bangers" font-size="56" fill="#FFFFFF" stroke="#111111" stroke-width="5" paint-order="stroke" text-anchor="middle">WARNING:</text>
    <text id="slot-blurb-2" y="48" class="fredoka" font-size="38" font-weight="700" fill="#111111" text-anchor="middle">MAY CAUSE GIGGLES</text>
  </g>

  <!-- ============ TINY IMPRINT ============ -->
  <text id="slot-imprint" x="800" y="2340" class="fredoka" font-size="26" font-weight="500" fill="#FFFFFF" text-anchor="middle" opacity="0.85">A TALES TOGETHER PRODUCTION · CONTAINS REAL IMAGINATION</text>
</svg>
