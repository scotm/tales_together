<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1600 2400" width="1600" height="2400" role="img" aria-labelledby="t d">
  <title id="t">Cover Option A — The Penny Dreadful Deluxe</title>
  <desc id="d">A Victorian chapbook poster on parchment: ink woodcut otter in an oval cameo, stacked display type, an oxblood ribbon banner, a rubber-stamp disclaimer and a wax seal bearing the author's initial.</desc>

  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Rye&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,600&family=Lexend:wght@500;700&display=swap');
      .rye      { font-family: 'Rye', 'Fraunces', Georgia, serif; }
      .fraunces { font-family: 'Fraunces', Georgia, serif; }
      .lexend   { font-family: 'Lexend', 'Helvetica Neue', Arial, sans-serif; }
    ]]></style>

    <!-- Paper grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <!-- Woodcut hatching: ink lines on transparent (for highlights on cream) -->
    <pattern id="hatchInk" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#1F1A17" stroke-width="2.2"/>
    </pattern>
    <!-- Woodcut hatching: cream lines on transparent (for highlights on ink) -->
    <pattern id="hatchCream" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#F3E7CF" stroke-width="2.4"/>
    </pattern>

    <clipPath id="cameo"><ellipse cx="800" cy="1250" rx="360" ry="400"/></clipPath>
    <clipPath id="sunburstClip"><circle cx="800" cy="1250" r="560"/></clipPath>

    <symbol id="fleuron" viewBox="-40 -40 80 80">
      <path d="M0 -34 L10 -10 L34 0 L10 10 L0 34 L-10 10 L-34 0 L-10 -10Z" fill="#1F1A17"/>
      <circle r="7" fill="#F3E7CF"/>
    </symbol>
    <symbol id="diamond" viewBox="-10 -10 20 20">
      <path d="M0 -9 L9 0 L0 9 L-9 0Z" fill="#1F1A17"/>
    </symbol>
  </defs>

  <!-- ============ PAPER ============ -->
  <rect width="1600" height="2400" fill="#F3E7CF"/>
  <rect width="1600" height="2400" filter="url(#grain)" opacity="0.13"/>

  <!-- ============ FRAME ============ -->
  <rect x="60" y="60" width="1480" height="2280" fill="none" stroke="#1F1A17" stroke-width="10"/>
  <rect x="92" y="92" width="1416" height="2216" fill="none" stroke="#1F1A17" stroke-width="3"/>
  <use href="#fleuron" x="52" y="52" width="80" height="80"/>
  <use href="#fleuron" x="1468" y="52" width="80" height="80"/>
  <use href="#fleuron" x="52" y="2268" width="80" height="80"/>
  <use href="#fleuron" x="1468" y="2268" width="80" height="80"/>

  <!-- ============ HEADER TYPE ============ -->
  <text x="800" y="235" class="fraunces" font-size="42" font-weight="700" letter-spacing="11" fill="#1F1A17" text-anchor="middle">THE ASTONISHING ADVENTURES OF</text>

  <text id="slot-title-1" x="800" y="430" class="rye" font-size="210" fill="#1F1A17" text-anchor="middle">BARNABY</text>
  <text id="slot-title-2" x="800" y="618" class="rye" font-size="210" fill="#1F1A17" text-anchor="middle">WHISKERS</text>

  <!-- rule with diamonds -->
  <line x1="300" y1="690" x2="1300" y2="690" stroke="#1F1A17" stroke-width="4"/>
  <use href="#diamond" x="278" y="678" width="24" height="24"/>
  <use href="#diamond" x="788" y="678" width="24" height="24"/>
  <use href="#diamond" x="1298" y="678" width="24" height="24"/>

  <text x="800" y="780" class="fraunces" font-size="40" font-style="italic" font-weight="400" fill="#1F1A17" text-anchor="middle">Being a True &amp; Faithful Account, in Five Chapters</text>

  <!-- ============ SUNBURST ============ -->
  <g clip-path="url(#sunburstClip)" fill="#1F1A17" opacity="0.07">
    <path d="M800 1250 L770 600 L830 600Z"/>
    <path d="M800 1250 L770 600 L830 600Z" transform="rotate(30 800 1250)"/>
    <path d="M800 1250 L770 600 L830 600Z" transform="rotate(60 800 1250)"/>
    <path d="M800 1250 L770 600 L830 600Z" transform="rotate(90 800 1250)"/>
    <path d="M800 1250 L770 600 L830 600Z" transform="rotate(120 800 1250)"/>
    <path d="M800 1250 L770 600 L830 600Z" transform="rotate(150 800 1250)"/>
    <path d="M800 1250 L770 600 L830 600Z" transform="rotate(180 800 1250)"/>
    <path d="M800 1250 L770 600 L830 600Z" transform="rotate(210 800 1250)"/>
    <path d="M800 1250 L770 600 L830 600Z" transform="rotate(240 800 1250)"/>
    <path d="M800 1250 L770 600 L830 600Z" transform="rotate(270 800 1250)"/>
    <path d="M800 1250 L770 600 L830 600Z" transform="rotate(300 800 1250)"/>
    <path d="M800 1250 L770 600 L830 600Z" transform="rotate(330 800 1250)"/>
  </g>

  <!-- ============ CAMEO ============ -->
  <ellipse cx="800" cy="1250" rx="360" ry="400" fill="#EADCBB"/>
  <ellipse cx="800" cy="1250" rx="360" ry="400" fill="url(#hatchInk)" opacity="0.08"/>

  <!-- Real hero illustration goes here (Python sets href + removes display:none and the placeholder group) -->
  <image id="slot-hero" x="440" y="850" width="720" height="800" preserveAspectRatio="xMidYMid slice"
         clip-path="url(#cameo)" display="none" href=""/>

  <!-- Woodcut otter placeholder art -->
  <g id="slot-hero-placeholder" clip-path="url(#cameo)">
    <!-- body -->
    <path d="M500 1720 C 530 1420, 680 1330, 800 1330 C 920 1330, 1070 1420, 1100 1720 Z" fill="#1F1A17"/>
    <ellipse cx="590" cy="1570" rx="55" ry="130" fill="url(#hatchCream)" opacity="0.55"/>
    <ellipse cx="1010" cy="1570" rx="55" ry="130" fill="url(#hatchCream)" opacity="0.55"/>
    <!-- apron -->
    <path d="M690 1372 L910 1372 L962 1665 L638 1665 Z" fill="#F3E7CF" stroke="#1F1A17" stroke-width="6"/>
    <g fill="#1F1A17">
      <circle cx="730" cy="1430" r="11"/><circle cx="822" cy="1420" r="11"/><circle cx="902" cy="1465" r="11"/>
      <circle cx="702" cy="1530" r="11"/><circle cx="792" cy="1520" r="11"/><circle cx="884" cy="1562" r="11"/>
      <circle cx="752" cy="1622" r="11"/><circle cx="852" cy="1632" r="11"/>
    </g>
    <!-- head -->
    <ellipse cx="800" cy="1190" rx="205" ry="175" fill="#1F1A17"/>
    <circle cx="630" cy="1062" r="46" fill="#1F1A17"/><circle cx="630" cy="1062" r="20" fill="#F3E7CF"/>
    <circle cx="970" cy="1062" r="46" fill="#1F1A17"/><circle cx="970" cy="1062" r="20" fill="#F3E7CF"/>
    <!-- muzzle -->
    <ellipse cx="800" cy="1255" rx="130" ry="92" fill="#F3E7CF"/>
    <ellipse cx="800" cy="1255" rx="130" ry="92" fill="url(#hatchInk)" opacity="0.28"/>
    <!-- eyes -->
    <circle cx="735" cy="1160" r="30" fill="#F3E7CF"/><circle cx="740" cy="1165" r="14" fill="#1F1A17"/><circle cx="733" cy="1157" r="5" fill="#F3E7CF"/>
    <circle cx="865" cy="1160" r="30" fill="#F3E7CF"/><circle cx="870" cy="1165" r="14" fill="#1F1A17"/><circle cx="863" cy="1157" r="5" fill="#F3E7CF"/>
    <!-- nose + mouth -->
    <ellipse cx="800" cy="1228" rx="32" ry="20" fill="#1F1A17"/>
    <path d="M765 1265 Q800 1302 835 1265" fill="none" stroke="#1F1A17" stroke-width="7" stroke-linecap="round"/>
    <!-- whiskers -->
    <g stroke="#1F1A17" stroke-width="6" stroke-linecap="round">
      <line x1="670" y1="1245" x2="545" y2="1222"/><line x1="670" y1="1264" x2="545" y2="1278"/>
      <line x1="930" y1="1245" x2="1055" y2="1222"/><line x1="930" y1="1264" x2="1055" y2="1278"/>
    </g>
    <!-- crooked chef hat -->
    <g transform="rotate(-8 800 1030)">
      <circle cx="715" cy="985" r="68" fill="#F3E7CF" stroke="#1F1A17" stroke-width="8"/>
      <circle cx="885" cy="985" r="68" fill="#F3E7CF" stroke="#1F1A17" stroke-width="8"/>
      <circle cx="800" cy="950" r="92" fill="#F3E7CF" stroke="#1F1A17" stroke-width="8"/>
      <ellipse cx="800" cy="965" rx="60" ry="40" fill="url(#hatchInk)" opacity="0.18"/>
      <rect x="675" y="1005" width="250" height="56" rx="10" fill="#F3E7CF" stroke="#1F1A17" stroke-width="8"/>
    </g>
  </g>

  <!-- cameo frame -->
  <ellipse cx="800" cy="1250" rx="360" ry="400" fill="none" stroke="#B8893A" stroke-width="16"/>
  <ellipse cx="800" cy="1250" rx="378" ry="418" fill="none" stroke="#1F1A17" stroke-width="6"/>
  <ellipse cx="800" cy="1250" rx="346" ry="386" fill="none" stroke="#1F1A17" stroke-width="3"/>
  <use href="#diamond" x="786" y="818" width="28" height="28"/>
  <use href="#diamond" x="786" y="1654" width="28" height="28"/>
  <use href="#diamond" x="408" y="1236" width="28" height="28"/>
  <use href="#diamond" x="1164" y="1236" width="28" height="28"/>

  <!-- ============ "& the" + RIBBON ============ -->
  <text x="800" y="1712" class="fraunces" font-size="64" font-style="italic" font-weight="600" fill="#1F1A17" text-anchor="middle">&amp; the</text>
  <g id="ribbon">
    <path d="M250 1740 L190 1790 L250 1840 L300 1840 L300 1740Z" fill="#6E1F1F"/>
    <path d="M1350 1740 L1410 1790 L1350 1840 L1300 1840 L1300 1740Z" fill="#6E1F1F"/>
    <rect x="250" y="1725" width="1100" height="130" fill="#8E2A2A" stroke="#1F1A17" stroke-width="6"/>
    <text id="slot-subtitle" x="800" y="1816" class="rye" font-size="80" fill="#F3E7CF" text-anchor="middle">RUNAWAY ROYAL CAKE</text>
  </g>

  <!-- ============ AUTHOR ============ -->
  <text x="800" y="1930" class="fraunces" font-size="40" font-style="italic" fill="#1F1A17" text-anchor="middle">Directed &amp; Co-Authored by</text>
  <text id="slot-author" x="800" y="2012" class="fraunces" font-size="72" font-weight="900" letter-spacing="4" fill="#1F1A17" text-anchor="middle">LEO, AGE 7</text>

  <!-- ============ RUBBER STAMP ============ -->
  <g transform="translate(420 2140) rotate(-6)" opacity="0.92">
    <rect x="-285" y="-70" width="570" height="140" rx="8" fill="none" stroke="#8E2A2A" stroke-width="7"/>
    <rect x="-273" y="-58" width="546" height="116" rx="4" fill="none" stroke="#8E2A2A" stroke-width="2"/>
    <text id="slot-blurb-1" y="-10" class="lexend" font-size="26" font-weight="700" letter-spacing="2" fill="#8E2A2A" text-anchor="middle">CONTAINS 100% GENUINE IMAGINATION</text>
    <text id="slot-blurb-2" y="38" class="lexend" font-size="26" font-weight="700" letter-spacing="2" fill="#8E2A2A" text-anchor="middle">NO DRAGONS WERE HARMED</text>
  </g>

  <!-- ============ WAX SEAL ============ -->
  <g transform="translate(1290 2100)">
    <path d="M-40 60 L-72 165 L-22 132 L12 172 L34 70Z" fill="#8E2A2A"/>
    <path d="M-36 70 L-50 150 L-26 128 L2 150 L22 76Z" fill="#6E1F1F"/>
    <circle r="96" fill="#A33232"/>
    <circle r="96" fill="none" stroke="#6E1F1F" stroke-width="6"/>
    <circle r="76" fill="none" stroke="#F3E7CF" stroke-width="3" stroke-dasharray="6 8" opacity="0.6"/>
    <text id="slot-seal-initial" y="36" class="rye" font-size="100" fill="#F3E7CF" text-anchor="middle">L</text>
  </g>

  <!-- ============ IMPRINT ============ -->
  <text id="slot-imprint" x="800" y="2296" class="lexend" font-size="26" font-weight="500" letter-spacing="5" fill="#1F1A17" text-anchor="middle">PUBLISHED BY LEO PRESS · FIRST EDITION · MMXXVI</text>
</svg>
