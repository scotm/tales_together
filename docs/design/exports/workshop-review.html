<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
nav {display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;font-family:var(--font-sans)}
button {font:inherit;padding:9px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--secondary);color:var(--secondary-foreground);cursor:pointer}
button[aria-pressed="true"] {background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
button:focus-visible {outline:2px solid var(--ring);outline-offset:3px}
img {display:block;width:100%;height:auto;border-radius:var(--radius)}
figure {margin:0} figure[hidden] {display:none} #phone {max-width:390px;margin:0 auto}
figcaption {font:13px var(--font-sans);color:var(--muted-foreground);margin-top:10px;line-height:1.5}
</style></head><body><nav aria-label="Design screens"><button aria-pressed="true" data-target="world">World setup</button><button aria-pressed="false" data-target="chapter">Chapter choices</button><button aria-pressed="false" data-target="phone">Phone</button></nav><figure id="world"><img src="/Users/scotm/src/tales_together/docs/design/exports/workshop-world.png" alt="World setup · desktop · 1440 × 1000"><figcaption>World setup · desktop · 1440 × 1000</figcaption></figure><figure id="chapter" hidden><img src="/Users/scotm/src/tales_together/docs/design/exports/workshop-chapter.png" alt="Chapter choices · desktop · 1440 × 1000"><figcaption>Chapter choices · desktop · 1440 × 1000</figcaption></figure><figure id="phone" hidden><img src="/Users/scotm/src/tales_together/docs/design/exports/workshop-phone.png" alt="World setup · scrolling phone layout · 390 × 1120"><figcaption>World setup · scrolling phone layout · 390 × 1120</figcaption></figure><script>document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('figure').forEach(f=>f.hidden=f.id!==b.dataset.target);document.querySelectorAll('button').forEach(t=>t.setAttribute('aria-pressed',String(t===b)));}));</script></body></html>
