<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
nav{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 10px;font-family:var(--font-sans)}button{font:inherit;font-size:13px;min-height:40px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--secondary);color:var(--secondary-foreground);cursor:pointer}button[aria-pressed="true"]{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}button:focus-visible{outline:2px solid var(--ring);outline-offset:3px}figure{margin:0}figure[hidden]{display:none}figure.phone{max-width:390px;margin:0 auto}img{display:block;width:100%;height:auto;border-radius:var(--radius)}p{font:13px/1.5 var(--font-sans);color:var(--muted-foreground);margin:9px 0 12px}.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}.footer p{margin:0}button:disabled{opacity:.4;cursor:default}
</style></head><body><nav aria-label="Character branch"><button data-hero="kid" aria-pressed="true">Kid Explorer</button><button data-hero="hero" aria-pressed="false">River otter</button></nav><nav aria-label="Device"><button data-device="desktop" aria-pressed="true">Desktop</button><button data-device="phone" aria-pressed="false">Phone</button></nav><nav aria-label="Character creation steps"><button data-step="0" aria-pressed="true">1 · Character</button><button data-step="1" aria-pressed="false">2 · Outfit</button><button data-step="2" aria-pressed="false">3 · Quirk</button><button data-step="3" aria-pressed="false">4 · Name</button></nav><p>Frame review · sample selections. Gender is optional; naming begins empty.</p><figure class="desktop" data-screen="kid-desktop-0"><img src="/Users/scotm/src/tales_together/docs/design/exports/kid-desktop-1.png" alt="Choose a character, kid branch, desktop design"></figure><figure class="desktop" data-screen="kid-desktop-1" hidden><img src="/Users/scotm/src/tales_together/docs/design/exports/kid-desktop-2.png" alt="Choose an outfit, kid branch, desktop design"></figure><figure class="desktop" data-screen="kid-desktop-2" hidden><img src="/Users/scotm/src/tales_together/docs/design/exports/kid-desktop-3.png" alt="Choose a funny quirk, kid branch, desktop design"></figure><figure class="desktop" data-screen="kid-desktop-3" hidden><img src="/Users/scotm/src/tales_together/docs/design/exports/kid-desktop-4.png" alt="Name and review the hero, kid branch, desktop design"></figure><figure class="phone" data-screen="kid-phone-0" hidden><img src="/Users/scotm/src/tales_together/docs/design/exports/kid-phone-1.png" alt="Choose a character, kid branch, phone design"></figure><figure class="phone" data-screen="kid-phone-1" hidden><img src="/Users/scotm/src/tales_together/docs/design/exports/kid-phone-2.png" alt="Choose an outfit, kid branch, phone design"></figure><figure class="phone" data-screen="kid-phone-2" hidden><img src="/Users/scotm/src/tales_together/docs/design/exports/kid-phone-3.png" alt="Choose a funny quirk, kid branch, phone design"></figure><figure class="phone" data-screen="kid-phone-3" hidden><img src="/Users/scotm/src/tales_together/docs/design/exports/kid-phone-4.png" alt="Name and review the hero, kid branch, phone design"></figure><figure class="desktop" data-screen="hero-desktop-0" hidden><img src="/Users/scotm/src/tales_together/docs/design/exports/hero-desktop-1.png" alt="Choose a character, hero branch, desktop design"></figure><figure class="desktop" data-screen="hero-desktop-1" hidden><img src="/Users/scotm/src/tales_together/docs/design/exports/hero-desktop-2.png" alt="Choose an outfit, hero branch, desktop design"></figure><figure class="desktop" data-screen="hero-desktop-2" hidden><img src="/Users/scotm/src/tales_together/docs/design/exports/hero-desktop-3.png" alt="Choose a funny quirk, hero branch, desktop design"></figure><figure class="desktop" data-screen="hero-desktop-3" hidden><img src="/Users/scotm/src/tales_together/docs/design/exports/hero-desktop-4.png" alt="Name and review the hero, hero branch, desktop design"></figure><figure class="phone" data-screen="hero-phone-0" hidden><img src="/Users/scotm/src/tales_together/docs/design/exports/hero-phone-1.png" alt="Choose a character, hero branch, phone design"></figure><figure class="phone" data-screen="hero-phone-1" hidden><img src="/Users/scotm/src/tales_together/docs/design/exports/hero-phone-2.png" alt="Choose an outfit, hero branch, phone design"></figure><figure class="phone" data-screen="hero-phone-2" hidden><img src="/Users/scotm/src/tales_together/docs/design/exports/hero-phone-3.png" alt="Choose a funny quirk, hero branch, phone design"></figure><figure class="phone" data-screen="hero-phone-3" hidden><img src="/Users/scotm/src/tales_together/docs/design/exports/hero-phone-4.png" alt="Name and review the hero, hero branch, phone design"></figure><div class="footer"><button id="prev" disabled>← Previous</button><p id="position" aria-live="polite">Step 1 of 4</p><button id="next">Next →</button></div><script>
let hero='kid',device='desktop',step=0;function update(){document.querySelectorAll('figure').forEach(f=>f.hidden=f.dataset.screen!==hero+'-'+device+'-'+step);document.querySelectorAll('[data-hero]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.hero===hero)));document.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.device===device)));document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.step)===step)));document.getElementById('prev').disabled=step===0;document.getElementById('next').disabled=step===3;document.getElementById('position').textContent='Step '+(step+1)+' of 4';}document.querySelectorAll('[data-hero]').forEach(b=>b.onclick=()=>{hero=b.dataset.hero;update()});document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{device=b.dataset.device;update()});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=Number(b.dataset.step);update()});document.getElementById('prev').onclick=()=>{step=Math.max(0,step-1);update()};document.getElementById('next').onclick=()=>{step=Math.min(3,step+1);update()};
</script></body></html>
